set-option -g default-shell /opt/homebrew/bin/fish
# Use Shift-arrow keys without prefix key to switch windows
bind -n C-Tab next-window
bind -n C-BTab previous-window
bind -n C-t new-window -a -c "#{pane_current_path}"
bind -n C-w kill-window

set -g mouse on

set -g status-style "bg=blue,fg=brightwhite,bold"

# Drop the default session-name prefix and pane-title/date/time suffix so the
# status bar is nothing but the tab list.
set -g status-left ""
set -g status-right ""

# Tab labels show only the window name: no "#I:" index prefix and no "-"/"*"
# flag suffix, since fish already puts everything useful in the name.
set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g window-status-separator ""

# The active tab is a block of the terminal's own background/foreground, so it
# reads as "cut out" of the blue status bar and follows the terminal theme.
set -g window-status-current-style "bg=terminal,fg=terminal,bold"

set-option -g automatic-rename off
set-option -g allow-rename off
