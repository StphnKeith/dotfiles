set-option -g default-shell /opt/homebrew/bin/fish
# Use Shift-arrow keys without prefix key to switch windows
bind -n C-Tab next-window
bind -n C-BTab previous-window
bind -n C-t new-window -a -c "#{pane_current_path}"
bind -n C-w kill-window

set -g mouse on

# Drop the default session-name prefix and pane-title/date/time suffix so the
# status bar is nothing but the tab list.
set -g status-left ""
# status-right is (ab)used to run the theme sync every status-interval (the only
# trigger for it); the script prints nothing, so the right side stays empty.
set -g status-right "#(sh ~/.config/alacritty/sync-theme.sh)"
set -g status-interval 5

# Tab labels show only the window name: no "#I:" index prefix and no "-"/"*"
# flag suffix, since fish already puts everything useful in the name.
set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g window-status-separator ""

# The active tab is a block of the terminal's own background/foreground, so it
# reads as "cut out" of the blue status bar and follows the terminal theme.
set -g window-status-current-style "bg=terminal,fg=terminal,noreverse,bold"
set -g status-style "bg=terminal,fg=blue,reverse,bold"

set-option -g automatic-rename off
set-option -g allow-rename off

# Keep window indices contiguous and matching left-to-right tab position, so
# closing a window doesn't leave a gap that makes -t <index> target the wrong
# tab.
set -g renumber-windows on

# Manual window naming, layered on top of the fish-driven auto-rename in
# conf.d/tmux_rename_window.fish. Renaming here sets the @manual_name window
# option, which that fish hook checks and skips while set, so a manual name
# sticks instead of getting overwritten on the next prompt/command.
bind-key , command-prompt -I "#W" "rename-window -- '%%' ; set-option -w @manual_name 1"
# Clear the flag to hand the window back to automatic naming; the name
# itself resyncs on the next prompt in that window.
bind-key . set-option -wu @manual_name


# Pass focus events to nvim so it re-checks light/dark mode on FocusGained.
set -g focus-events on
